[project]
name = "room-sim"
version = "0.1.0"
description = "Turn a scanned TurtleBot3 occupancy map into a Gazebo (gz sim) world"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.scripts]
room-sim-world = "room_sim.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/room_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
